name: Deploy test sites

on:
  push:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      taguardian: ${{ steps.filter.outputs.taguardian }}
      athletedatahub: ${{ steps.filter.outputs.athletedatahub }}
      doomcheck: ${{ steps.filter.outputs.doomcheck }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            taguardian:
              - 'apps/taguardian-com/**'
            athletedatahub:
              - 'apps/athletedatahub/**'
            doomcheck:
              - 'apps/doomcheck/**'
            infra:
              - 'docker-compose.yml'
              - 'Caddyfile'

  deploy:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.taguardian == 'true' ||
      needs.detect-changes.outputs.athletedatahub == 'true' ||
      needs.detect-changes.outputs.doomcheck == 'true' ||
      needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Le site de demonstration doit servir EXACTEMENT ce qu'un client recoit.
      #
      # Il embarque ses propres copies du snippet, et c'est voulu : elles le
      # rendent autonome, testable sans reseau externe, et servi par le meme
      # domaine que la politique de masquage. Mais une copie qu'on resynchronise
      # a la main se desynchronise -- constate le 31/07, trois versions
      # coexistaient (1.16.0 dans le depot, 1.19.0 en ligne, 1.20.0 sur le CDN),
      # et la demo montrait donc un build que plus personne ne recevait.
      #
      # On les rafraichit donc A CHAQUE DEPLOIEMENT, depuis le CDN de
      # production. Le depot garde une copie pour les tests ; ce qui part sur le
      # VPS est toujours la derniere version publiee, sans intervention.
      #
      # Ne PAS remplacer par un curl direct dans le SCP : on veut echouer AVANT
      # d'ecraser quoi que ce soit sur le VPS si le CDN repond mal.
      - name: Rafraichir le snippet depuis le CDN de production
        run: |
          set -euo pipefail
          DIR=apps/athletedatahub/public
          for F in korvus.min.js korvus-proof.min.js; do
            curl -fsS --compressed --max-time 30 \
              "https://cdn.korvus.fr/v1/$F" -o "/tmp/$F"
            # Un CDN qui rend une page d'erreur en 200 produirait un fichier
            # minuscule et parfaitement valide du point de vue de curl.
            SIZE=$(wc -c < "/tmp/$F")
            if [ "$SIZE" -lt 50000 ]; then
              echo "::error::$F fait $SIZE octets, trop petit pour un bundle"
              exit 1
            fi
            mv "/tmp/$F" "$DIR/$F"
            echo "$F rafraichi ($SIZE octets)"
          done
          # La version doit etre lisible : c'est elle qui remonte dans
          # sessions.snippet_version et qui sert au diagnostic d'incident.
          grep -o '__korvus_version="[^"]*"' "$DIR/korvus.min.js" | head -1

      - name: Sync files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 91.134.132.241
          username: debian
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "apps/,docker-compose.yml,Caddyfile"
          target: /opt/korvus-test-sites
          overwrite: true

      - name: Rebuild and restart
        uses: appleboy/ssh-action@v1
        with:
          host: 91.134.132.241
          username: debian
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/korvus-test-sites

            APPS=""
            if [ "${{ needs.detect-changes.outputs.taguardian }}" == "true" ] || [ "${{ needs.detect-changes.outputs.infra }}" == "true" ]; then
              APPS="$APPS taguardian-com"
            fi
            if [ "${{ needs.detect-changes.outputs.athletedatahub }}" == "true" ] || [ "${{ needs.detect-changes.outputs.infra }}" == "true" ]; then
              APPS="$APPS athletedatahub"
            fi
            if [ "${{ needs.detect-changes.outputs.doomcheck }}" == "true" ] || [ "${{ needs.detect-changes.outputs.infra }}" == "true" ]; then
              APPS="$APPS doomcheck"
            fi

            if [ -n "$APPS" ]; then
              sudo docker compose build $APPS
              sudo docker compose up -d $APPS
            fi

            if [ "${{ needs.detect-changes.outputs.infra }}" == "true" ]; then
              sudo cp Caddyfile /opt/caddy/Caddyfile
              sudo docker exec caddy-caddy-1 caddy reload --config /etc/caddy/Caddyfile
            fi
